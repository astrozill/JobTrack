{% extends "base.html" %}

{% block title %}Log in | JobTrack{% endblock %}

{% block content_class %}auth{% endblock %}

{% block content %}
<h1>Log in to JobTrack</h1>
<form class="panel" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
</form>
<p>Don't have an account? <a href="{% url 'applications:register' %}">Register</a></p>
{% endblock %}
