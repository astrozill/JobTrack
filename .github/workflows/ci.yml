name: JobTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-only-django-secret-key-for-jobtrack-tests"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1],testserver"
      DB_NAME: jobtrack_ci
      DB_USER: jobtrack_ci
      DB_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jobtrack_ci
          POSTGRES_USER: jobtrack_ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U jobtrack_ci -d jobtrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply and verify migrations
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run automated tests
        run: python manage.py test --noinput

      - name: Build Docker image
        run: docker build --tag jobtrack:ci .
